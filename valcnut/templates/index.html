{% extends 'base.html' %}

{% block content %}
<div style="text-align: center;">
    <h2>Добро пожаловать в мир Валькнут!</h2>
    <p>Классическая браузерная MMORPG в стиле скандинавских мифов.</p>
    <div style="margin-top: 30px;">
        {% if not user.is_authenticated %}
            <a href="{% url 'login' %}" class="btn">Войти в игру</a>
            <a href="{% url 'register' %}" class="btn">Создать персонажа</a>
        {% else %}
            <a href="{% url 'game_index' %}" class="btn">Продолжить путь</a>
        {% endif %}
    </div>
</div>
{% endblock %}
