{% extends 'base.html' %}

{% block title %}Вход - Valcnut{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2>Вход в Мидгард</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Войти</button>
    </form>
    <p style="margin-top: 20px;">Нет персонажа? <a href="{% url 'register' %}" style="color: #8b7355;">Зарегистрироваться</a></p>
</div>
{% endblock %}
