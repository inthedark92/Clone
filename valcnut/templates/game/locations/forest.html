{% extends 'game/game_base.html' %}

{% block location_title %}{{ title }}{% endblock %}

{% block location_content %}
<div class="location-description">
    <p>Мрачные деревья смыкаются над вашей головой. Слышны шорохи и далекий вой.</p>
    <p>Здесь вы можете найти достойного противника и испытать свою силу.</p>
</div>

<div class="actions" style="margin-top: 20px;">
    <form method="POST" action="{% url 'start_pve' %}">
        {% csrf_token %}
        <button type="submit" style="background: #8b0000; color: #fff; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; font-size: 16px;">Начать охоту</button>
    </form>
</div>
{% endblock %}
