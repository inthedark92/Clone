{% extends 'game/game_base.html' %}

{% block location_title %}Карта Мира{% endblock %}

{% block location_content %}
<div class="map-container" style="position: relative; width: 100%; height: 600px; background: #000; border: 2px solid #8b0000; overflow: hidden;">
    <!-- Simple representation of locations as nodes -->
    <div class="map-node" style="position: absolute; top: 250px; left: 450px; width: 100px; text-align: center;">
        <div style="width: 20px; height: 20px; background: #ffd700; margin: 0 auto; border-radius: 50%;"></div>
        <a href="{% url 'location' 'central_square' %}" style="color: #fff; text-decoration: none; font-size: 12px;">Площадь</a>
    </div>

    <div class="map-node" style="position: absolute; top: 150px; left: 450px; width: 100px; text-align: center;">
        <div style="width: 20px; height: 20px; background: #c0c0c0; margin: 0 auto; border-radius: 50%;"></div>
        <a href="{% url 'location' 'castle' %}" style="color: #fff; text-decoration: none; font-size: 12px;">Замок</a>
    </div>

    <div class="map-node" style="position: absolute; top: 350px; left: 450px; width: 100px; text-align: center;">
        <div style="width: 20px; height: 20px; background: #8b4513; margin: 0 auto; border-radius: 50%;"></div>
        <a href="{% url 'location' 'suburb' %}" style="color: #fff; text-decoration: none; font-size: 12px;">Пригород</a>
    </div>

    <div class="map-node" style="position: absolute; top: 250px; left: 350px; width: 100px; text-align: center;">
        <div style="width: 20px; height: 20px; background: #006400; margin: 0 auto; border-radius: 50%;"></div>
        <a href="{% url 'location' 'forest' %}" style="color: #fff; text-decoration: none; font-size: 12px;">Лес</a>
    </div>

    <!-- Add more nodes to fulfill "Map" requirement -->
</div>
{% endblock %}
