<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valcnut MMORPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>VALCNUT</h1>
            <nav id="main-nav" class="hidden">
                <button onclick="showScreen('arena')">Arena</button>
                <button onclick="showScreen('inventory')">Inventory</button>
                <button onclick="showScreen('shop')">Shop</button>
                <button id="logout-btn">Logout</button>
            </nav>
        </header>

        <main>
            <!-- Auth Screen -->
            <section id="auth-screen">
                <h2>Login to Midgard</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button id="login-btn">Login</button>
                <button id="register-btn">Register</button>
            </section>

            <!-- Character Creation -->
            <section id="char-create-screen" class="hidden">
                <h2>Create Your Viking</h2>
                <input type="text" id="char-name" placeholder="Character Name">
                <button id="create-char-btn">Start Journey</button>
            </section>

            <!-- Arena / Battle -->
            <section id="arena-screen" class="hidden">
                <div class="battle-container">
                    <div class="combatants">
                        <div id="player-status">HP: <span id="player-hp">?</span></div>
                        <div id="enemy-status">HP: <span id="enemy-hp">?</span></div>
                    </div>
                    <div class="combat-log" id="combat-log"></div>
                    <div class="combat-controls">
                        <h3>Select Hit Zone</h3>
                        <div class="zones">
                            <button onclick="submitTurn(1)">Head</button>
                            <button onclick="submitTurn(2)">Body</button>
                            <button onclick="submitTurn(3)">Belt</button>
                            <button onclick="submitTurn(4)">Legs</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Chat -->
            <aside id="chat-box" class="hidden">
                <div id="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Type message...">
            </aside>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
